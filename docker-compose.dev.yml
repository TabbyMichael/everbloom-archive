version: '3.8'

services:
  postgres:
    image: postgis/postgis:14-3.2
    container_name: everbloom-postgres
    environment:
      - POSTGRES_DB=everbloom
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: everbloom-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/everbloom
      - SECRET_KEY=everbloom-secret-key-change-in-production-2024
      - ALLOWED_ORIGINS=["http://localhost:8080", "http://172.24.208.1:8080"]
      - DEBUG=True
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
