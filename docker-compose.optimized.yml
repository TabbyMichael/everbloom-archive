version: '3.8'

services:
  # PostgreSQL Database - using smaller image
  postgres:
    image: postgres:15-alpine
    container_name: everbloom-postgres-optimized
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-everbloom}
      - POSTGRES_USER=${POSTGRES_USER:-everbloom_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - everbloom-network
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-everbloom_user} -d ${POSTGRES_DB:-everbloom}"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Backend API - using optimized image
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.optimized
    container_name: everbloom-backend-optimized
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-everbloom_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-everbloom}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
      - ./backend/logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - everbloom-network
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Nginx reverse proxy - using alpine image
  nginx:
    image: nginx:alpine
    container_name: everbloom-nginx-optimized
    volumes:
      - ./nginx/nginx-optimized.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/var/www/uploads:ro
      - ./frontend/dist:/var/www/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - everbloom-network
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local

networks:
  everbloom-network:
    driver: bridge
